<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&amp;display=swap');
    text { font-family: 'Poppins', sans-serif; }
  </style>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="#1a3a4a"/>
  
  <!-- Accent bar -->
  <rect width="1200" height="8" fill="#3EABBF"/>
  
  <!-- Logo only -->
  <image xlink:href="sentius-logo.png" x="40" y="40" width="100" height="100"/>
  
  <!-- Main heading -->
  <text x="600" y="180" font-size="52" font-weight="600" fill="#ffffff" text-anchor="middle">How It Works</text>
  
  <!-- Step 1 -->
  <circle cx="150" cy="360" r="50" fill="#3EABBF"/>
  <text x="150" y="370" font-size="36" text-anchor="middle">1</text>
  <text x="150" y="450" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">Free Review</text>
  
  <!-- Arrow -->
  <line x1="200" y1="360" x2="290" y2="360" stroke="#3EABBF" stroke-width="3"/>
  
  <!-- Step 2 -->
  <circle cx="380" cy="360" r="50" fill="#245566"/>
  <text x="380" y="370" font-size="32" text-anchor="middle">2</text>
  <text x="380" y="450" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">Recommendations</text>
  
  <!-- Arrow -->
  <line x1="430" y1="360" x2="520" y2="360" stroke="#3EABBF" stroke-width="3"/>
  
  <!-- Step 3 -->
  <circle cx="610" cy="360" r="50" fill="#1a3a4a" stroke="#3EABBF" stroke-width="2"/>
  <text x="610" y="370" font-size="32" text-anchor="middle">3</text>
  <text x="610" y="450" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">Implementation</text>
  
  <!-- Arrow -->
  <line x1="660" y1="360" x2="750" y2="360" stroke="#3EABBF" stroke-width="3"/>
  
  <!-- Step 4 -->
  <circle cx="840" cy="360" r="50" fill="#3EABBF"/>
  <text x="840" y="370" font-size="32" text-anchor="middle">4</text>
  <text x="840" y="450" font-size="14" font-weight="600" fill="#0f2533" text-anchor="middle">Ongoing Support</text>
  
  <!-- Arrow -->
  <line x1="890" y1="360" x2="980" y2="360" stroke="#3EABBF" stroke-width="3"/>
  
  <!-- Final checkmark -->
  <circle cx="1050" cy="360" r="50" fill="#4CAF50"/>
  <text x="1050" y="375" font-size="40" text-anchor="middle" fill="#ffffff">✓</text>
  
  <!-- CTA -->
  <rect x="400" y="540" width="400" height="50" rx="8" fill="#3EABBF"/>
  <text x="600" y="575" font-size="18" font-weight="600" fill="#1a3a4a" text-anchor="middle">Book your free review</text>
</svg>

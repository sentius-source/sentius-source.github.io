<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&amp;display=swap');
    text { font-family: 'Poppins', sans-serif; }
  </style>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="#1a3a4a"/>
  
  <!-- Accent bar -->
  <rect width="1200" height="8" fill="#3EABBF"/>
  
  <!-- Logo only -->
  <image xlink:href="sentius-logo.png" x="40" y="40" width="100" height="100"/>
  
  <!-- Main heading -->
  <text x="600" y="180" font-size="52" font-weight="600" fill="#ffffff" text-anchor="middle">Published Pricing</text>
  <text x="600" y="235" font-size="24" fill="#3EABBF" text-anchor="middle">No hidden fees. Transparent rates.</text>
  
  <!-- Pricing tiers -->
  <rect x="80" y="280" width="220" height="120" rx="8" fill="#3EABBF"/>
  <text x="190" y="310" font-size="28" font-weight="600" fill="#0f2533" text-anchor="middle">£30</text>
  <text x="190" y="340" font-size="16" font-weight="500" fill="#0f2533" text-anchor="middle">Essentials</text>
  <text x="190" y="365" font-size="12" fill="#0f2533" text-anchor="middle">/user/month</text>
  
  <rect x="330" y="280" width="220" height="120" rx="8" fill="#245566"/>
  <text x="440" y="310" font-size="28" font-weight="600" fill="#e8f2f7" text-anchor="middle">£55</text>
  <text x="440" y="340" font-size="16" font-weight="500" fill="#e8f2f7" text-anchor="middle">Protected</text>
  <text x="440" y="365" font-size="12" fill="#9fbfd4" text-anchor="middle">/user/month</text>
  
  <rect x="580" y="280" width="220" height="120" rx="8" fill="#1a3a4a" stroke="#3EABBF" stroke-width="2"/>
  <text x="690" y="310" font-size="28" font-weight="600" fill="#3EABBF" text-anchor="middle">£80</text>
  <text x="690" y="340" font-size="16" font-weight="500" fill="#e8f2f7" text-anchor="middle">Complete</text>
  <text x="690" y="365" font-size="12" fill="#9fbfd4" text-anchor="middle">/user/month</text>
  
  <rect x="830" y="280" width="220" height="120" rx="8" fill="#3EABBF"/>
  <text x="940" y="310" font-size="28" font-weight="600" fill="#0f2533" text-anchor="middle">£15</text>
  <text x="940" y="340" font-size="16" font-weight="500" fill="#0f2533" text-anchor="middle">Mailbox Only</text>
  <text x="940" y="365" font-size="12" fill="#0f2533" text-anchor="middle">/mailbox/month</text>
  
  <!-- Bottom text -->
  <text x="600" y="450" font-size="18" fill="#cccccc" text-anchor="middle">All prices ex-VAT. M365 licenses billed separately at cost.</text>
  
  <!-- CTA -->
  <rect x="400" y="490" width="400" height="50" rx="8" fill="#3EABBF"/>
  <text x="600" y="525" font-size="18" font-weight="600" fill="#1a3a4a" text-anchor="middle">Book a free security review</text>
  
  <!-- Footer -->
  <text x="600" y="600" font-size="14" fill="#999999" text-anchor="middle">sentius.co.uk/pricing</text>
</svg>
